name: Bản tin hằng ngày

on:
  schedule:
    - cron: "10 21 * * *" # 04:10 giờ VN (UTC+7); GitHub có thể trễ vài phút
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions: {}

jobs:
  news:
    # Collect RSS and (optionally) summarize with Claude. No write permission here:
    # RSS text is untrusted input for the model.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect news
        run: python -m x3daily collect-news
      - name: Summarize in Vietnamese with Claude (optional)
        if: env.HAS_CLAUDE == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: "Read prompts/news_summary.md and follow it exactly."
          claude_args: --allowedTools "Read,Write" --max-turns 6
      - uses: actions/upload-artifact@v4
        with:
          name: news
          path: work/
          if-no-files-found: error

  build:
    needs: news
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit data/gold.csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: news
          path: work/
      - name: Install x3book
        # Note: the x3book repository must exist and be public before this works.
        run: pip install "git+https://github.com/HoangTran-17/x3book"
      - name: Build site
        env:
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
          BRIEF_SECRET_PATH: ${{ secrets.BRIEF_SECRET_PATH }}
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m x3daily build
      - name: Commit gold history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gold.csv
          if git diff --cached --quiet; then
            echo "No change in gold.csv"
          else
            git commit -m "Cập nhật lịch sử giá vàng $(date -u +%F)"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
