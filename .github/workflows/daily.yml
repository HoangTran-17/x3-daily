name: Bản tin hằng ngày

on:
  schedule:
    - cron: "10 21 * * *" # 04:10 giờ VN (UTC+7); GitHub có thể trễ vài phút
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions: {}

jobs:
  news:
    # Collect RSS and (optionally) translate with Gemini, Claude as fallback. No write permission here:
    # RSS text is untrusted input for the model.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_GOOGLE: ${{ secrets.GOOGLE_API_KEY != '' }}
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect news
        run: python -m x3daily collect-news
      - name: Translate to Vietnamese with Gemini (optional)
        id: gemini
        if: env.HAS_GOOGLE == 'true'
        continue-on-error: true
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }} # optional repo variable; empty = default in config.py
        run: python -m x3daily translate-news
      - name: Summarize in Vietnamese with Claude (optional, only when Gemini did not succeed)
        id: claude
        if: env.HAS_CLAUDE == 'true' && steps.gemini.outcome != 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: "Read prompts/news_summary.md and follow it exactly."
          claude_args: --allowedTools "Read,Write" --max-turns 6
      # The action hides its output; print only the final error text (e.g. bad token) so failures are diagnosable.
      - name: Show Claude error
        if: steps.claude.outcome == 'failure' && steps.claude.outputs.execution_file != ''
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          python - <<'EOF'
          import json, os
          data = json.load(open(os.environ["EXEC_FILE"]))
          items = data if isinstance(data, list) else [data]
          for it in items:
              if isinstance(it, dict) and it.get("type") == "result":
                  print("::warning::Claude: " + str(it.get("result", ""))[:300].replace("\n", " "))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: news
          path: work/
          if-no-files-found: error

  build:
    needs: news
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit data/gold.csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: news
          path: work/
      - name: Install x3book
        # Note: the x3book repository must exist and be public before this works.
        run: pip install "git+https://github.com/HoangTran-17/x3book"
      - name: Build site
        env:
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m x3daily build
      - name: Commit gold history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gold.csv
          if git diff --cached --quiet; then
            echo "No change in gold.csv"
          else
            git commit -m "Cập nhật lịch sử giá vàng $(date -u +%F)"
            git pull --rebase -q # main may have moved since checkout (re-run of an old run)
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish site to orphan branch device (for X3 via contents API)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf "$RUNNER_TEMP/device" && cp -r _site "$RUNNER_TEMP/device"
          cd "$RUNNER_TEMP/device"
          git init -q -b device
          git config user.name "x3-daily bot"
          git config user.email "x3-daily-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Bản tin $(TZ=Asia/Ho_Chi_Minh date +%F)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" device
      - name: Update secret gist with calendar brief (optional)
        # The calendar brief stays out of every artifact; it only leaves the runner via the gist API.
        # continue-on-error: a gist failure must not block today's public Pages deploy.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$GIST_ID" ] || [ ! -f out-private/brief.json ]; then
            echo "Gist skipped: needs GCAL_ICS_URL, GIST_TOKEN and GIST_ID"
            exit 0
          fi
          if ! printf '%s' "$GIST_ID" | grep -Eq '^[0-9a-f]+$'; then
            echo "::warning::GIST_ID must be the hex id of the gist, not its URL"
            exit 1
          fi
          payload="$RUNNER_TEMP/gist.json"
          python -c 'import json,sys; print(json.dumps({"files": {"brief.json": {"content": open(sys.argv[1], encoding="utf-8").read()}}}))' out-private/brief.json > "$payload"
          if gh api --method PATCH "gists/$GIST_ID" --input "$payload" --silent; then
            echo "Gist updated"
          else
            echo "::warning::Gist update failed; check GIST_TOKEN (scope gist) and GIST_ID"
            rm -f "$payload"
            exit 1
          fi
          rm -f "$payload" out-private/brief.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
